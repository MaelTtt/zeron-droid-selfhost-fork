name: fork-release

# Personal-fork releases: build the Linux headless tarballs and publish them
# as a GitHub Release on THIS repo, so every other device on the fork gets
# the sidebar "Update available" button (and `zeron update`) straight from
# the fork — no homelab edge publish step required.
#
# The engine's fork updater polls these releases directly:
#   - discovery:  GET https://api.github.com/repos/<fork>/releases
#   - artifacts:  https://github.com/<fork>/releases/download/v<ver>/
# Only tags shaped `v<version>-mael.N` matching the workspace version in
# Cargo.toml are considered newer (see `version_newer` in crates/update).
#
# Tag shape is `v<version>` with NO slash (e.g. `v0.2.102-mael.4`, not
# `mael/v0.2.102-mael.4`): slashes break GitHub's release-download URLs.
# release.yml explicitly ignores `v*-mael.*` tags so the stock pipeline
# never fires on a fork tag.
#
# Triggers:
#   - push to main whose `[workspace.package] version` is a `-mael.N` with no
#     `v<version>` tag yet: builds, then tags + publishes that commit. So
#     "bump the version and push main" is a release.
#   - push of a tag `v<version>-mael.N` matching the workspace version.
#     Pushing main and the tag together publishes once (the main run sees
#     the tag and leaves it to the tag run).
#   - workflow_dispatch: builds artifacts, no GitHub release.
#
# Flow per device after cutting a release:
#   1. home PC: bump version, commit, `git push origin main` (optionally with the tag)
#   2. CI builds + attaches `zeron-<ver>-linux-*.tar.gz` + `manifest.json`
#   3. other devices: account menu "Update Zeron fork" (or the sidebar strip,
#      or `zeron update`) stages into `~/.zeron/app/fork-<ver>/` and restarts.
#
# Stock official releases never trigger the fork button: fork installs ignore
# non `-mael.N` versions entirely. To adopt an official release with fork
# patches, run `zeron-fork-update` on the home PC, then cut a new fork
# release here.

on:
  push:
    branches: [main]
    tags: ["v*-mael.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        run: |
          ver="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          build=false publish=false
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            workflow_dispatch:*) build=true ;;
            push:tag)
              [ "${GITHUB_REF_NAME#v}" = "$ver" ] \
                || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1; }
              build=true publish=true ;;
            push:branch)
              case "$ver" in
                *-mael.*)
                  if git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
                    echo "v$ver is already tagged; nothing to release"
                  else
                    build=true publish=true
                  fi ;;
                *) echo "$ver is not a fork version; nothing to release" ;;
              esac ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$ver build=$build publish=$publish"

  linux:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04 # x86_64
          - runner: ubuntu-24.04-arm # aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gpui system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: mold linker (required by .cargo/config.toml)
        # `-fuse-ld=mold` (x86_64 only) makes gcc look up `ld.mold` on PATH;
        # a bare `mold` binary alone fails the link with exit 101.
        run: |
          mkdir -p ~/.local/bin
          arch="$(uname -m)"
          ver="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/rui314/mold/releases/latest | jq -r .tag_name | sed 's/^v//')"
          curl -fsSL "https://github.com/rui314/mold/releases/download/v${ver}/mold-${ver}-${arch}-linux.tar.gz" | tar xz
          cp "mold-${ver}-${arch}-linux/bin/mold" ~/.local/bin/mold
          ln -sf mold ~/.local/bin/ld.mold
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/mold --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-linux-${{ runner.arch }}
          path: target/package/*.tar.gz
          if-no-files-found: error

  android:
    needs: [resolve]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Cold: the Rust core for arm64 (thin LTO), bindings, Gradle, NDK 29.
    timeout-minutes: 60
    env:
      NDK_VERSION: 29.0.14206865
      # Phones: arm64 only (an x86_64 core would double the download).
      ZERON_ANDROID_ABIS: arm64-v8a
      # Published builds: thin LTO, stripped — the profile iOS archives use.
      ZERON_ANDROID_PROFILE: mobile-dist
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION"
      - name: rust toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - name: build tools (cargo-ndk, rsvg-convert)
        run: |
          cargo install cargo-ndk --locked
          sudo apt-get update -q && sudo apt-get install -y -q librsvg2-bin

      - id: version
        name: version (Cargo.toml) and build number
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Only grows: Android installs a build over another only when it's higher.
          echo "BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - id: signing
        name: release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "No release key: signing with a throwaway debug key. The APK installs, but a later build won't install over it; add ANDROID_KEYSTORE_BASE64/PASSWORD/KEY_ALIAS/KEY_PASSWORD to the repo secrets for update-in-place."
            exit 0
          fi
          keystore="$RUNNER_TEMP/zeron-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "ZERON_ANDROID_KEYSTORE=$keystore"
            echo "ZERON_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ZERON_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ZERON_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: assemble release APK
        working-directory: apps/android
        run: ./gradlew :app:assembleRelease -PzeronVersionCode="$BUILD_NUMBER" --console=plain --no-configuration-cache

      - name: package
        run: |
          mkdir -p out/android
          apk="out/android/zeron-$VERSION-android-arm64.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$apk"
          (cd out/android && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          ls -la out/android
          rm -f "$RUNNER_TEMP/zeron-release.jks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fork-android
          path: out/android/*
          if-no-files-found: error

  publish:
    # Fork tag pushes, and main pushes carrying an untagged `-mael.N` version
    # (see `resolve`); workflow_dispatch builds artifacts without a release.
    if: needs.resolve.outputs.publish == 'true'
    needs: [resolve, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: version guard (artifacts == Cargo.toml version)
        env:
          VER: ${{ needs.resolve.outputs.version }}
        run: |
          ver="$VER"
          echo "release version: $ver"
          ls dist/
          case "$ver" in
            *-mael.*) ;;
            *) echo "$ver is not a fork version (want <version>-mael.N)"; exit 1;;
          esac
          for f in dist/zeron-"$ver"-linux-*.tar.gz; do
            test -f "$f" || { echo "missing artifact for tag v$ver (want zeron-$ver-linux-<arch>.tar.gz)"; exit 1; }
          done
          test -f dist/zeron-"$ver"-android-arm64.apk \
            || { echo "missing Android APK for tag v$ver (want zeron-$ver-android-arm64.apk)"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
      - name: updater manifest
        run: |
          manifest=$(jq -n --arg version "$VERSION" '{version: $version, files: {}}')
          for f in dist/*; do
            sha=$(sha256sum "$f" | cut -d' ' -f1)
            manifest=$(jq --arg name "$(basename "$f")" --arg sha "$sha" \
              '.files[$name] = {sha256: $sha}' <<<"$manifest")
          done
          printf '%s' "$manifest" > manifest.json
          cat manifest.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          # Main-push releases create the tag on the built commit.
          tag_name: v${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*
            manifest.json
          generate_release_notes: true
